server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: openscout-agent-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/openscout?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:openscout}
    password: ${MYSQL_PASSWORD:openscout}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: ${SPRING_AI_MODEL_IMAGE:none}
      moderation: ${SPRING_AI_MODEL_MODERATION:none}
      audio:
        speech: ${SPRING_AI_MODEL_AUDIO_SPEECH:none}
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-pro}

openscout:
  collector-base-url: ${OPSCOUT_COLLECTOR_BASE_URL:http://localhost:8081}
  mock-agent: ${OPSCOUT_MOCK_AGENT:true}
  collector-mode: ${OPSCOUT_COLLECTOR_MODE:mock}
  llm:
    enabled: ${OPSCOUT_LLM_ENABLED:true}
    timeout-seconds: ${OPSCOUT_LLM_TIMEOUT_SECONDS:30}
    max-tokens: ${OPSCOUT_LLM_MAX_TOKENS:2000}
    temperature: ${OPSCOUT_LLM_TEMPERATURE:0.7}
  learning:
    enabled: ${OPSCOUT_LEARNING_ENABLED:true}
  persistence:
    enabled: ${OPSCOUT_PERSISTENCE_ENABLED:false}
  memory:
    enabled: ${OPSCOUT_MEMORY_ENABLED:true}
    freshness-hours: ${OPSCOUT_MEMORY_FRESHNESS_HOURS:24}
  react:
    enabled: ${OPSCOUT_REACT_ENABLED:true}
    max-rounds: ${OPSCOUT_REACT_MAX_ROUNDS:1}
    max-follow-up-repos: ${OPSCOUT_REACT_MAX_FOLLOW_UP_REPOS:3}
  verifier:
    enabled: ${OPSCOUT_VERIFIER_ENABLED:true}
    llm-enabled: ${OPSCOUT_VERIFIER_LLM_ENABLED:false}
  events:
    enabled: ${OPSCOUT_EVENTS_ENABLED:true}
    sse-timeout-seconds: ${OPSCOUT_EVENTS_SSE_TIMEOUT_SECONDS:300}
    buffer-size: ${OPSCOUT_EVENTS_BUFFER_SIZE:200}
    max-active-runs: ${OPSCOUT_EVENTS_MAX_ACTIVE_RUNS:20}
    executor-threads: ${OPSCOUT_EVENTS_EXECUTOR_THREADS:4}
    heartbeat-seconds: ${OPSCOUT_EVENTS_HEARTBEAT_SECONDS:15}
    completed-retention-seconds: ${OPSCOUT_EVENTS_COMPLETED_RETENTION_SECONDS:300}
  trace:
    max-summary-length: ${OPSCOUT_TRACE_MAX_SUMMARY_LENGTH:800}
  security:
    enabled: ${OPSCOUT_SECURITY_ENABLED:false}
    api-key: ${OPSCOUT_API_KEY:}
    header-name: ${OPSCOUT_API_KEY_HEADER:X-OpenScout-Api-Key}
  quota:
    enabled: ${OPSCOUT_QUOTA_ENABLED:false}
    max-requests-per-window: ${OPSCOUT_QUOTA_MAX_REQUESTS:30}
    window-seconds: ${OPSCOUT_QUOTA_WINDOW_SECONDS:60}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

services:
  mysql:
    image: mysql:8.4
    container_name: openscout-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openscout}
      MYSQL_USER: ${MYSQL_USER:-openscout}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-openscout}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - openscout-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: openscout-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - openscout-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  collector:
    build:
      context: ../openscout-repo-collector
      dockerfile: Dockerfile
    container_name: openscout-collector
    ports:
      - "${GO_COLLECTOR_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      OPSCOUT_COLLECTOR_MODE: ${OPSCOUT_COLLECTOR_MODE:-github}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPSCOUT_COLLECTOR_API_KEY: ${OPSCOUT_COLLECTOR_API_KEY:-}
      OPSCOUT_API_KEY_HEADER: ${OPSCOUT_API_KEY_HEADER:-X-OpenScout-Api-Key}
      OPSCOUT_RATE_LIMIT_RPS: ${OPSCOUT_RATE_LIMIT_RPS:-2}
      OPSCOUT_RATE_LIMIT_BURST: ${OPSCOUT_RATE_LIMIT_BURST:-4}
      OPSCOUT_CACHE_TTL_MINUTES: ${OPSCOUT_CACHE_TTL_MINUTES:-10}
      OPSCOUT_WORKER_CONCURRENCY: ${OPSCOUT_WORKER_CONCURRENCY:-4}
      OPSCOUT_HTTP_TIMEOUT_SECONDS: ${OPSCOUT_HTTP_TIMEOUT_SECONDS:-8}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: ../openscout-agent-server
      dockerfile: Dockerfile
    container_name: openscout-agent
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-openscout}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:-openscout}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-openscout}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-openai}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      OPSCOUT_COLLECTOR_BASE_URL: http://collector:8081
      OPSCOUT_COLLECTOR_MODE: ${OPSCOUT_COLLECTOR_MODE:-github}
      OPSCOUT_MOCK_AGENT: ${OPSCOUT_MOCK_AGENT:-false}
      OPSCOUT_LLM_ENABLED: ${OPSCOUT_LLM_ENABLED:-true}
      OPSCOUT_PERSISTENCE_ENABLED: ${OPSCOUT_PERSISTENCE_ENABLED:-false}
      OPSCOUT_LLM_TIMEOUT_SECONDS: ${OPSCOUT_LLM_TIMEOUT_SECONDS:-60}
      OPSCOUT_LLM_MAX_TOKENS: ${OPSCOUT_LLM_MAX_TOKENS:-2000}
      OPSCOUT_LLM_TEMPERATURE: ${OPSCOUT_LLM_TEMPERATURE:-0.7}
      OPSCOUT_MEMORY_ENABLED: ${OPSCOUT_MEMORY_ENABLED:-true}
      OPSCOUT_REACT_ENABLED: ${OPSCOUT_REACT_ENABLED:-true}
      OPSCOUT_VERIFIER_ENABLED: ${OPSCOUT_VERIFIER_ENABLED:-true}
      OPSCOUT_EVENTS_ENABLED: ${OPSCOUT_EVENTS_ENABLED:-true}
      OPSCOUT_LEARNING_ENABLED: ${OPSCOUT_LEARNING_ENABLED:-true}
      OPSCOUT_SECURITY_ENABLED: ${OPSCOUT_SECURITY_ENABLED:-false}
      OPSCOUT_API_KEY: ${OPSCOUT_API_KEY:-}
      OPSCOUT_API_KEY_HEADER: ${OPSCOUT_API_KEY_HEADER:-X-OpenScout-Api-Key}
      OPSCOUT_QUOTA_ENABLED: ${OPSCOUT_QUOTA_ENABLED:-false}
      OPSCOUT_EVENTS_SSE_TIMEOUT_SECONDS: ${OPSCOUT_EVENTS_SSE_TIMEOUT_SECONDS:-300}
      OPSCOUT_EVENTS_BUFFER_SIZE: ${OPSCOUT_EVENTS_BUFFER_SIZE:-200}
      OPSCOUT_EVENTS_MAX_ACTIVE_RUNS: ${OPSCOUT_EVENTS_MAX_ACTIVE_RUNS:-20}
      OPSCOUT_EVENTS_EXECUTOR_THREADS: ${OPSCOUT_EVENTS_EXECUTOR_THREADS:-4}
      OPSCOUT_EVENTS_HEARTBEAT_SECONDS: ${OPSCOUT_EVENTS_HEARTBEAT_SECONDS:-15}
      OPSCOUT_EVENTS_COMPLETED_RETENTION_SECONDS: ${OPSCOUT_EVENTS_COMPLETED_RETENTION_SECONDS:-300}
      OPSCOUT_CORS_ALLOWED_ORIGINS: ${OPSCOUT_CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mysql:
        condition: service_healthy
      collector:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  openscout-mysql-data:
  openscout-redis-data:

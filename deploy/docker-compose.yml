services:
  mysql:
    image: mysql:8.4
    container_name: openscout-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openscout}
      MYSQL_USER: ${MYSQL_USER:-openscout}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-openscout}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - openscout-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: openscout-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - openscout-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  openscout-mysql-data:
  openscout-redis-data:

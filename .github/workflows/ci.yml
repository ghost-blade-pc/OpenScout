name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  java-test:
    name: Java Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven test (full suite)
        run: mvn test
        working-directory: openscout-agent-server

      - name: Agent Evaluation (default mock)
        run: mvn test -Dtest=AgentEvaluationCommandTest
        working-directory: openscout-agent-server

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: openscout-repo-collector/go.sum

      - name: Go test
        run: go test ./...
        working-directory: openscout-repo-collector

  compose-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose -f deploy/docker-compose.yml config --quiet
